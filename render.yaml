services:
  - type: web
    name: clothing-store-app
    env: node
    buildCommand: npm install && npm run build
    startCommand: node server/server.js
    envVars:
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: wan-shop/clothing-store-app
      - key: GITHUB_BRANCH
        value: main
    healthCheckPath: /api/health
    autoDeploy: true
